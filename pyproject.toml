[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingenium-rag"
version = "0.3.0"
description = "SharePoint document extraction and Parent-Child Hybrid RAG for Ingenium."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
etl = [
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "msal>=1.28",
  "requests>=2.31",
  "rich>=13.0",
]
rag = [
  "FlagEmbedding>=1.2",
  "torch>=2.2",
  "transformers>=4.40",
  "langchain-text-splitters>=0.2",
  "qdrant-client>=1.10",
  "httpx>=0.27",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
]
all = ["ingenium-rag[etl,rag,api,dev]"]

[project.scripts]
ingenium-ingest = "scripts.ingest:main"
ingenium-query = "scripts.query:main"
ingenium-eval = "scripts.eval:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/api",
  "src/chunking",
  "src/embedding",
  "src/etl",
  "src/evaluation",
  "src/generation",
  "src/retrieval",
  "src/storage",
  "scripts",
]

[tool.hatch.build.targets.wheel.force-include]
"src/domain.py" = "domain.py"
"src/config.py" = "config.py"
"src/pipeline.py" = "pipeline.py"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "slow: loads real BGE-M3 / reranker model weights (deselect with -m 'not slow')",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
