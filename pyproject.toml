[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingenium-rag"
version = "0.1.0"
description = "SharePoint document ingestion and grounded retrieval for Ingenium."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
ingenium-query = "scripts.query_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingenium_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
