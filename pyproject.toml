[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingenium-rag"
version = "0.2.0"
description = "SharePoint document ingestion and grounded Parent-Child hybrid retrieval for Ingenium."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Document extraction & metadata matching (src/etl)
etl = [
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "msal>=1.28",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13.0",
]
# Chunking, BGE-M3 hybrid embeddings, reranking and local Qdrant storage
rag = [
  "FlagEmbedding>=1.2",
  "torch>=2.2",
  "transformers>=4.40",
  "langchain-text-splitters>=0.2",
  "qdrant-client>=1.10",
  "httpx>=0.27",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
]
all = ["ingenium-rag[etl,rag,api,dev]"]

[project.scripts]
ingenium-etl = "etl.cli:app"
ingenium-ingest = "scripts.ingest_folder:main"
ingenium-query = "scripts.query_cli:main"

# Flat `src/` layout: every top-level package/module under src/ is importable directly
# (e.g. `import domain`, `from etl.pipeline import ETLPipeline`).
[tool.hatch.build.targets.wheel]
packages = [
  "src/api",
  "src/etl",
  "src/generation",
  "src/pipelines",
  "src/processing",
  "src/retrieval",
  "src/storage",
  "scripts",
  "evaluation",
]

[tool.hatch.build.targets.wheel.force-include]
"src/domain.py" = "domain.py"
"src/config.py" = "config.py"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "slow: loads real BGE-M3 / reranker model weights (deselect with -m 'not slow')",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
