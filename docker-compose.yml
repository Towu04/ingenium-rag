services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ingenium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    env_file: .env
    depends_on:
      - qdrant
      - postgres
    ports:
      - "8000:8000"

volumes:
  qdrant_data:
  postgres_data:
