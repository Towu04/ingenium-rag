services:
  vectordb:
    image: pgvector/pgvector:pg16
    container_name: ingenium_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ingenium
      POSTGRES_PASSWORD: ingenium_dev_password
      POSTGRES_DB: ingenium_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingenium -d ingenium_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data: